<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- Template icon for the macOS menu bar.
       Black shapes on a transparent background; macOS uses the alpha channel
       and recolors automatically for light/dark menu bars + click highlight.
       Motif: a rounded speech bubble with three dots (chat / conversation). -->
  <mask id="bubble-cut">
    <!-- White = painted (visible). Bubble body + tail. -->
    <rect x="4" y="6" width="36" height="24" rx="8" fill="white"/>
    <path d="M13 28 L13 38 L24 28 Z" fill="white"/>
    <!-- Black = knocked out (the three dots show through as holes). -->
    <circle cx="13.5" cy="18" r="2.6" fill="black"/>
    <circle cx="22"   cy="18" r="2.6" fill="black"/>
    <circle cx="30.5" cy="18" r="2.6" fill="black"/>
  </mask>
  <rect width="44" height="44" fill="black" mask="url(#bubble-cut)"/>
</svg>
