name: Release

# 推送形如 v1.2.3 的 tag 时触发，自动多平台打包并创建 GitHub Release。
# 也支持在 Actions 页面手动触发（workflow_dispatch）做冒烟测试。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action 需要写权限来创建 Release 并上传产物。
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (arm64)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: aarch64-apple-darwin
          # Intel macOS (x64)
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: x86_64-apple-darwin
          # Windows (x64)
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            rust_targets: x86_64-pc-windows-msvc
          # Windows (arm64)
          - platform: windows-latest
            args: '--target aarch64-pc-windows-msvc'
            rust_targets: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tag(例如 v0.1.5)触发时，用 tag 作为唯一版本号来源写入 package.json 和 Cargo.toml。
      # tauri.conf.json 的 version 已指向 ../package.json，因此打出来的安装包/资源名会随之变化。
      # 手动触发(workflow_dispatch)时跳过此步，沿用仓库里已提交的版本号。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.APP_VERSION.replace(/^v/, "");
            const pj = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pj.version = v;
            fs.writeFileSync("package.json", JSON.stringify(pj, null, 2) + "\n");
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = ".*"$/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            console.log("Synced version to", v);
          '

      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QuickChat ${{ github.ref_name }}'
          releaseBody: '下载对应平台的安装包并安装。详见资源列表。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
