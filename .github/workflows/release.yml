name: Release

# 推送形如 v1.2.3 的 tag 时触发，自动多平台打包并创建 GitHub Release。
# 也支持在 Actions 页面手动触发（workflow_dispatch）做冒烟测试。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action 需要写权限来创建 Release 并上传产物。
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (arm64)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: aarch64-apple-darwin
          # Intel macOS (x64)
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: x86_64-apple-darwin
          # Linux（webkit2gtk 4.1 需要 22.04+）
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          # Windows
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QuickChat ${{ github.ref_name }}'
          releaseBody: '下载对应平台的安装包并安装。详见资源列表。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
